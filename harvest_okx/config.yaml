name: OKX Volatility Harvester
version: "0.3.0"
slug: harvest_okx
description: >-
  Constant-weight rebalancing bot for OKX spot. Earns the volatility harvest
  (sigma^2/8) instead of forecasting price, with an ingress control panel,
  paper trading by default and Home Assistant notifications
url: https://github.com/dadge/hassio/tree/master/harvest_okx
arch:
  - amd64
  - aarch64
startup: services
hassio_api: true
homeassistant_api: true
ingress: true
panel_icon: mdi:chart-timeline-variant
panel_title: Harvester
options:
  mode: dry-run
  i_understand_live_trading: false
  okx_environment: okx
  quote_currency: USDT
  okx_api_key: ""
  okx_api_secret: ""
  okx_api_passphrase: ""
  basket_size: 10
  target_exposure_pct: 50.0
  rebalance_band_pct: 1.0
  volatility_lookback_days: 30
  reselect_days: 30
  min_volume_usdt: 5000000.0
  min_order_usdt: 5.0
  paper_wallet_usdt: 1000.0
  live_max_deployed_usdt: 100.0
  check_interval_minutes: 15
  notifications_enabled: true
  notify_service: notify.mobile_app_op15
  log_level: info
schema:
  mode: list(dry-run|live)
  i_understand_live_trading: bool
  okx_environment: list(okx|myokx)
  # Independent of okx_environment, which only picks the API hostname.
  # USDC has far fewer spot pairs on OKX than USDT, so a USDC basket is
  # selected from a much smaller universe.
  quote_currency: list(USDT|USDC)
  okx_api_key: password?
  okx_api_secret: password?
  okx_api_passphrase: password?
  # 3..25: below 3 a single asset's drift dominates the basket; above 25 the
  # per-leg order sizes fall under the exchange minimum on a small wallet.
  basket_size: int(3,25)
  # Fraction of the wallet held in crypto; the rest stays in the quote currency.
  # The harvest is quadratic in this and the market-drift exposure is linear,
  # so values above ~70 give up a lot of downside protection for little gain.
  target_exposure_pct: float(5,100)
  # Rebalance once any leg drifts this far (in percentage points) from target.
  # Tighter bands harvest marginally more but pay fees far more often.
  rebalance_band_pct: float(0.2,10)
  volatility_lookback_days: int(7,180)
  reselect_days: int(1,365)
  min_volume_usdt: float(0,)
  min_order_usdt: float(1,)
  paper_wallet_usdt: float(50,)
  live_max_deployed_usdt: float(10,)
  check_interval_minutes: int(1,1440)
  notifications_enabled: bool
  notify_service: str
  log_level: list(info|debug)
